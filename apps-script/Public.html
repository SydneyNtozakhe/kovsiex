<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KovsieX Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1d28;--card:#455560;--card2:#3c4a54;--ink:#fff;--muted:#c9d3da;--pink:#f018b4;--pink2:#ff3fc8;--field:#d9d9d9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 15% 0%,#173246 0,transparent 45%),radial-gradient(circle at 100% 100%,#2a1636 0,transparent 40%),var(--bg)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.16em;font-size:20px;text-transform:uppercase}
.brand sup{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-left:3px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.player{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px #0006}
.pl-top{display:flex;gap:36px;align-items:center;padding:40px}
@media(max-width:560px){.pl-top{flex-direction:column;align-items:flex-start;gap:22px;padding:26px}}
.art{width:208px;height:208px;border-radius:12px;object-fit:cover;flex:none;background:#2b3943}
.art.ph{display:grid;place-items:center;font-size:64px;color:#ffffff66;background:linear-gradient(135deg,#f018b4,#4a2c55 65%,#1d3a4a)}
.meta{min-width:0;flex:1}
.src{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:14px}
.src i{width:26px;height:26px;border-radius:50%;background:#fff;color:#455560;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px}
.title{font-size:23px;font-weight:500;line-height:1.25;margin:0}
.artist{font-size:16px;font-weight:500;color:#e8eef2;margin:6px 0 18px}
.ctrls{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.playbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--pink);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:16px;flex:none}
.playbtn:hover{background:var(--pink2)}
.vol{display:flex;align-items:center;gap:12px;color:#dfe6ea}
input[type=range]{-webkit-appearance:none;appearance:none;width:160px;height:3px;background:linear-gradient(90deg,var(--pink) var(--p,70%),#fff var(--p,70%));border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--pink);cursor:pointer}
.reqbtn{background:#d9d9d9;color:#1b2a33;border:0;border-radius:4px;padding:10px 16px;font-size:15px;cursor:pointer}
.reqbtn:hover{background:#fff}
.form{background:#fff;color:#1b2a33;border-radius:12px;margin:0;padding:40px}
@media(max-width:560px){.form{padding:24px}}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.form input,.form textarea{width:100%;background:var(--field);border:0;border-radius:10px;padding:12px 18px;font-size:17px;color:#1b2a33}
.form input::placeholder,.form textarea::placeholder{color:#7a868e}
.form textarea{font-size:14px;min-height:68px;resize:vertical;margin-bottom:20px}
.form select{width:100%;background:#d9d9d9;border:2px solid #1b2a33;border-radius:10px;padding:10px 16px;font-size:17px;color:#1b2a33;cursor:pointer}
.form .btns{display:flex;gap:20px}
.submit{background:var(--pink);color:#fff;border:0;border-radius:4px;padding:12px 26px;font-size:15px;cursor:pointer}
.submit:hover{background:var(--pink2)}
.submit:disabled{opacity:.6;cursor:wait}
.cancel{background:#fff;color:#1b2a33;border:2px solid var(--pink);border-radius:4px;padding:10px 26px;font-size:15px;cursor:pointer}
.hp{position:absolute;left:-5000px;width:1px;height:1px;opacity:0}
.msg{margin-top:14px;font-size:14px;min-height:20px}
.msg.ok{color:#11865f} .msg.bad{color:#c4262c}
.card{background:#1b2f3c;border:1px solid #2b4352;border-radius:12px;padding:20px 22px;margin-bottom:22px}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.onair{display:inline-flex;align-items:center;gap:7px;background:#e5484d;color:#fff;font-weight:700;font-size:11px;letter-spacing:.14em;padding:4px 10px;border-radius:4px}
.onair i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.offair{display:inline-block;background:#ffffff14;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.14em;padding:4px 10px;border-radius:4px}
@keyframes pulse{50%{opacity:.25}}
.show{display:flex;gap:16px;align-items:center}
.show img,.show .ph{width:76px;height:76px;border-radius:8px;object-fit:cover;flex:none}
.show .ph{display:grid;place-items:center;font-weight:700;font-size:24px;background:linear-gradient(135deg,#f018b4,#4a2c55)}
.show b{display:block;font-size:17px;color:#ff7ad8;font-weight:600}
.show span{display:block;color:var(--muted);font-size:13.5px}
.timer{margin-left:auto;text-align:right}
.timer div{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.track{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #2b4352;border-radius:6px;margin-bottom:8px;background:#20384a}
.track img,.track .ph{width:52px;height:52px;border-radius:4px;object-fit:cover;flex:none}
.track .ph{display:grid;place-items:center;background:#ffffff12;color:#ffffff88}
.track .t{flex:1;min-width:0}
.track .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .t span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .tm{font-size:19px;font-variant-numeric:tabular-nums}
.empty{color:#8aa0ae;text-align:center;padding:14px}
footer{text-align:center;color:#7e93a1;font-size:12.5px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">KovsieX<sup>RADIO</sup></div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="grid">
    <div>
      <div class="player">
        <div class="pl-top">
          <div id="artBox"><div class="art ph">♪</div></div>
          <div class="meta">
            <div class="src"><i>♪</i><span id="srcTxt">Now playing on KovsieX</span></div>
            <h1 class="title" id="npTitle">KovsieX Radio</h1>
            <div class="artist" id="npArtist">Live from the UFS campus</div>
            <div class="ctrls">
              <button class="playbtn hidden" id="playBtn" aria-label="Play">▶</button>
              <div class="vol hidden" id="volBox"><span aria-hidden="true">🔊</span><input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume"></div>
            </div>
            <button class="reqbtn" id="openReq">send a request</button>
          </div>
        </div>
        <form class="form hidden" id="reqForm" onsubmit="return false;" autocomplete="off">
          <div class="frow">
            <input id="rName" maxlength="40" placeholder="Name" required>
            <select id="rType" aria-label="Type"></select>
          </div>
          <textarea id="rMsg" maxlength="300" placeholder="Your message" required></textarea>
          <input class="hp" id="rWeb" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="btns"><button class="submit" id="rSend" type="submit">submit</button><button class="cancel" type="button" id="rCancel">cancel</button></div>
          <div class="msg" id="rMsgOut"></div>
        </form>
      </div>
      <audio id="aud" preload="none"></audio>
    </div>

    <div>
      <div class="card" id="airCard"><h2><span>On air</span><span class="offair">OFF AIR</span></h2><div class="empty">Loading…</div></div>
      <div class="card"><h2>Recently played</h2><div id="recent"><div class="empty">Loading…</div></div></div>
    </div>
  </div>
  <footer>KovsieX · University of the Free State student media</footer>
</div>

<script>
(function () {
"use strict";
var TZ = 'Africa/Johannesburg';
var LIVE = typeof google !== 'undefined' && google.script && google.script.run;
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).split('').map(function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c] || c; }).join(''); };
var ini = function (n) { return String(n || '?').split(' ').filter(Boolean).map(function (x) { return x[0]; }).slice(0, 2).join('').toUpperCase(); };
var offset = 0, state = null, typesSet = false;

function run(fn, arg) {
  if (!LIVE) return Promise.resolve(DEMO[fn] ? DEMO[fn](arg) : null);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    if (arg === undefined) r[fn](); else r[fn](arg);
  });
}
function hms(ms) { return new Date(ms).toLocaleTimeString('en-GB', { timeZone: TZ, hour12: false }); }
function dur(ms) { ms = Math.max(0, ms); var h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }

function render(st) {
  state = st; if (st.serverNow) offset = st.serverNow - Date.now();
  var np = st.nowPlaying;
  $('artBox').innerHTML = np && np.art ? '<img class="art" src="' + esc(np.art) + '" alt="">' : '<div class="art ph">♪</div>';
  $('npTitle').textContent = np ? np.title : (st.onAir.length ? st.onAir[0].show : 'KovsieX Radio');
  $('npArtist').textContent = np ? np.artist : (st.onAir.length ? 'with ' + st.onAir[0].name : 'Live from the UFS campus');
  $('srcTxt').textContent = np ? 'Now playing · ' + np.at : (st.onAir.length ? 'On air now' : 'KovsieX Radio');
  if (!typesSet) { $('rType').innerHTML = st.types.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join(''); typesSet = true; }
  if (st.streamUrl) { if ($('aud').getAttribute('src') !== st.streamUrl) $('aud').setAttribute('src', st.streamUrl);
    $('playBtn').classList.remove('hidden'); $('volBox').classList.remove('hidden'); }

  var now = Date.now() + offset, a = st.onAir[0], n = st.next;
  var pic = function (o) { return o.image ? '<img src="' + o.image + '" alt="">' : '<div class="ph">' + esc(ini(o.show)) + '</div>'; };
  var h = '<h2><span>' + (a ? 'On air now' : 'Up next') + '</span>' + (a ? '<span class="onair"><i></i>ON AIR</span>' : '<span class="offair">OFF AIR</span>') + '</h2>';
  if (a) h += '<div class="show">' + pic(a) + '<div><b>' + esc(a.show) + '</b><span>' + esc(a.name) + (a.with ? ' with ' + esc(a.with) : '') + '</span><span>' + a.start + ' – ' + a.end + '</span></div>' +
      '<div class="timer"><div data-since="' + a.startMs + '">' + dur(now - a.startMs) + '</div><small>live for</small></div></div>';
  else if (n) h += '<div class="show">' + pic(n) + '<div><b>' + esc(n.show) + '</b><span>' + esc(n.name) + (n.with ? ' with ' + esc(n.with) : '') + '</span><span>' + n.start + ' – ' + n.end + '</span></div>' +
      '<div class="timer"><div data-until="' + n.startMs + '">' + dur(n.startMs - now) + '</div><small>starts in</small></div></div>';
  else h += '<div class="empty">No shows scheduled yet — check back soon.</div>';
  $('airCard').innerHTML = h;

  var list = st.recent || [];
  $('recent').innerHTML = list.length ? list.map(function (p) {
    return '<div class="track">' + (p.art ? '<img src="' + esc(p.art) + '" alt="">' : '<div class="ph">♪</div>') +
      '<div class="t"><b>' + esc(p.title) + '</b><span>' + esc(p.artist) + '</span></div><div class="tm">' + esc(p.at) + '</div></div>';
  }).join('') : '<div class="empty">No songs logged yet today.</div>';
}

function tick() {
  var now = Date.now() + offset;
  $('clock').textContent = hms(now) + ' SAST';
  var ended = false;
  document.querySelectorAll('[data-since]').forEach(function (e) { e.textContent = dur(now - Number(e.getAttribute('data-since'))); });
  document.querySelectorAll('[data-until]').forEach(function (e) { var r = Number(e.getAttribute('data-until')) - now; if (r <= 0) ended = true; e.textContent = dur(r); });
  if (ended) refresh();
}
function refresh() { return run('publicGetState').then(function (st) { if (st) render(st); }).catch(function () {}); }

$('openReq').onclick = function () { $('reqForm').classList.remove('hidden'); $('openReq').classList.add('hidden'); $('rName').focus(); };
$('rCancel').onclick = function () { $('reqForm').classList.add('hidden'); $('openReq').classList.remove('hidden'); $('rMsgOut').textContent = ''; };
$('reqForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var out = $('rMsgOut'), b = $('rSend'); out.className = 'msg'; out.textContent = ''; b.disabled = true;
  run('publicSendRequest', { name: $('rName').value, type: $('rType').value, message: $('rMsg').value, website: $('rWeb').value })
    .then(function () { out.className = 'msg ok'; out.textContent = 'Sent! The presenter will see it in the studio.'; $('rMsg').value = ''; })
    .catch(function (err) { out.className = 'msg bad'; out.textContent = String((err && err.message) || err).split('Error: ').join(''); })
    .then(function () { b.disabled = false; });
});
var aud = $('aud');
function setVol() { var v = Number($('vol').value); aud.volume = v / 100; $('vol').style.setProperty('--p', v + '%'); }
$('vol').oninput = setVol; setVol();
$('playBtn').onclick = function () {
  if (aud.paused) { aud.play().then(function () { $('playBtn').textContent = '❚❚'; }).catch(function () { $('playBtn').textContent = '▶'; }); }
  else { aud.pause(); $('playBtn').textContent = '▶'; }
};

var DEMO = {
  publicGetState: function () { var t = Date.now(); return { serverNow: t, streamUrl: '', types: ['Request','Shoutout','Traffic','Joke','Competition','Other'],
    nowPlaying: { title: 'Push It', artist: 'Salt-N-Pepa', art: '', at: '19:58' },
    onAir: [{ show: 'Drive Time', name: 'Ayanda Dlamini', with: 'Lerato Nkosi', start: '17:00', end: '19:00', image: '', startMs: t - 47 * 6e4, endMs: t + 73 * 6e4 }], next: null,
    recent: [{ title: 'Push It', artist: 'Salt-N-Pepa', art: '', at: '19:58' }, { title: 'Water', artist: 'Tyla', art: '', at: '19:54' }, { title: 'Mnike', artist: 'Tyler ICU, Tumela_za', art: '', at: '19:50' }] }; },
  publicSendRequest: function () { return { ok: true }; }
};

tick(); setInterval(tick, 1000);
refresh(); setInterval(refresh, 20000);
})();
</script>
</body>
</html>
