<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KovsieX Radio · Live</title>
<meta name="description" content="Listen live to KovsieX Radio, see what's playing right now and send in your requests.">
<meta name="theme-color" content="#0b1a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1a24; --panel:#132836; --panel2:#18303f; --line:#24414f; --ink:#ffffff; --muted:#a9bcc8; --dim:#6f8796;
  --pink:#f018b4; --pink2:#ff3fc8; --red:#e5484d; --field:#e4e7ea;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 10% -10%,#183a52 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#2c1238 0,transparent 55%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 48px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--pink),#7a2b8f);display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 6px 20px #f018b455}
.brand b{font-size:18px;letter-spacing:.16em;text-transform:uppercase;display:block;line-height:1.1}
.brand span{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:14px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#ffffff08}
.onair-pill{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-weight:700;font-size:11px;letter-spacing:.16em;padding:7px 12px;border-radius:99px}
.onair-pill i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.offair-pill{display:inline-block;background:#ffffff10;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.16em;padding:7px 12px;border-radius:99px;border:1px solid var(--line)}
@keyframes pulse{50%{opacity:.25}}

.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

/* Live panel */
.live{position:relative;border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 30px 70px #0008;isolation:isolate}
.live-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.55;z-index:-2;transition:opacity .6s,background-image .6s}
.live::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0b1a2499 0%,#0b1a24d9 70%,#0b1a24 100%);z-index:-1}
.live-top{display:flex;gap:32px;align-items:center;padding:36px 36px 22px}
@media(max-width:600px){.live-top{flex-direction:column;align-items:flex-start;gap:22px;padding:24px 22px 16px}}
.art-wrap{position:relative;flex:none}
.art{width:230px;height:230px;border-radius:14px;object-fit:cover;display:block;background:#1b3443;box-shadow:0 18px 44px #000a}
@media(max-width:600px){.meta{width:100%}.art-wrap{width:100%;max-width:280px}.art{width:100%;height:auto;aspect-ratio:1}.art.ph{height:auto}}
.art.ph{display:grid;place-items:center;font-size:72px;color:#ffffff55;background:linear-gradient(135deg,#f018b4,#4a2c55 60%,#1d3a4a)}
.meta{min-width:0;flex:1}
.np-label{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#ffb4ea;margin-bottom:12px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--pink2);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.2s}.eq i:nth-child(4){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.eq.paused i{animation:none;height:3px}
.title{font-size:30px;font-weight:600;line-height:1.15;margin:0 0 6px;word-break:break-word}
.artist{font-size:17px;font-weight:500;color:#dde6ec;margin:0 0 20px}
@media(max-width:600px){.title{font-size:24px}}
.prog{margin-bottom:18px}
.bar{height:5px;border-radius:9px;background:#ffffff22;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2));border-radius:9px;transition:width .9s linear}
.times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.playbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--pink);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 8px 24px #f018b466;transition:transform .15s,background .15s}
.playbtn:hover{background:var(--pink2);transform:scale(1.05)}
.playbtn svg{width:18px;height:18px}
.vol{display:flex;align-items:center;gap:10px;color:#dfe6ea}
.vol svg{width:18px;height:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:3px;background:linear-gradient(90deg,var(--pink) var(--p,70%),#ffffffaa var(--p,70%));border-radius:3px;outline:none;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--pink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--pink);cursor:pointer}
.reqbtn{background:#ffffffe6;color:#132836;border:0;border-radius:8px;padding:11px 18px;font-size:14.5px;font-weight:500;cursor:pointer;transition:background .15s}
.reqbtn:hover{background:#fff}
.swap{animation:swap .7s ease}
@keyframes swap{0%{opacity:1;transform:none}35%{opacity:0;transform:translateY(8px)}65%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:none}}
.live-foot{display:flex;align-items:center;gap:12px;padding:14px 36px 18px;border-top:1px solid #ffffff14;color:var(--muted);font-size:13px}
@media(max-width:600px){.live-foot{padding:12px 22px 16px}}
.live-foot img,.live-foot .ph{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none}
.live-foot .ph{display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:linear-gradient(135deg,#f018b4,#4a2c55)}
.live-foot b{color:#fff;font-weight:600}
.live-foot .t{margin-left:auto;font-variant-numeric:tabular-nums;color:#fff;font-weight:600;white-space:nowrap}

/* Request form */
.form{background:#fff;color:#132836;border-radius:16px;padding:30px;margin-top:22px;box-shadow:0 20px 50px #0006}
.form h3{margin:0 0 18px;font-size:18px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:560px){.frow{grid-template-columns:1fr}.form{padding:22px}}
.form input,.form textarea,.form select{width:100%;background:var(--field);border:2px solid transparent;border-radius:10px;padding:12px 16px;font-size:16px;color:#132836}
.form input:focus,.form textarea:focus,.form select:focus{outline:none;border-color:var(--pink)}
.form input::placeholder,.form textarea::placeholder{color:#7a868e}
.form textarea{min-height:84px;resize:vertical;margin-bottom:16px;font-size:15px}
.form select{border-color:#132836;cursor:pointer}
.btns{display:flex;gap:14px}
.submit{background:var(--pink);color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:15px;font-weight:500;cursor:pointer}
.submit:hover{background:var(--pink2)}
.submit:disabled{opacity:.6;cursor:wait}
.cancel{background:#fff;color:#132836;border:2px solid var(--pink);border-radius:8px;padding:10px 24px;font-size:15px;cursor:pointer}
.hp{position:absolute;left:-5000px;width:1px;height:1px;opacity:0}
.msg{margin-top:14px;font-size:14px;min-height:20px}
.msg.ok{color:#11865f} .msg.bad{color:#c4262c}

/* Side cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:22px;box-shadow:0 14px 40px #0005}
.card h2{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.show{display:flex;gap:16px;align-items:center}
.show img,.show .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none}
.show .ph{display:grid;place-items:center;font-weight:700;font-size:22px;background:linear-gradient(135deg,#f018b4,#4a2c55)}
.show b{display:block;font-size:17px;color:#ff7ad8;font-weight:600}
.show span{display:block;color:var(--muted);font-size:13.5px}
.timer{margin-left:auto;text-align:right}
.timer div{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}

/* Recently played */
.rp{display:flex;flex-direction:column}
.track{display:flex;gap:12px;align-items:center;padding:9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  max-height:90px;margin-bottom:9px;overflow:hidden;transition:max-height .5s ease,margin .5s ease,padding .5s ease,opacity .5s ease,transform .5s ease,border-width .5s}
.track.enter{max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;opacity:0;transform:translateY(-14px);border-width:0}
.track.leave{max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;opacity:0;transform:translateY(14px);border-width:0}
.track img,.track .ph{width:54px;height:54px;border-radius:8px;object-fit:cover;flex:none;background:#0f2230}
.track .ph{display:grid;place-items:center;color:#ffffff66}
.track .t{flex:1;min-width:0}
.track .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .t span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .tm{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;color:#e8eef2}
.empty{color:var(--dim);text-align:center;padding:14px}
footer{text-align:center;color:#6f8796;font-size:12.5px;margin-top:34px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark">X</div><div><b>KovsieX</b><span>Radio · UFS</span></div></div>
    <div class="hdr-r"><span class="offair-pill" id="airPill">OFF AIR</span><span class="clock" id="clock">--:--:-- SAST</span></div>
  </header>

  <div class="grid">
    <div>
      <section class="live" aria-live="polite">
        <div class="live-bg" id="liveBg"></div>
        <div class="live-top" id="liveTop">
          <div class="art-wrap" id="artBox"><div class="art ph">♪</div></div>
          <div class="meta">
            <div class="np-label"><span class="eq paused" id="eq"><i></i><i></i><i></i><i></i></span><span id="npLabel">KovsieX Radio</span></div>
            <h1 class="title" id="npTitle">KovsieX Radio</h1>
            <p class="artist" id="npArtist">Live from the UFS campus</p>
            <div class="prog hidden" id="prog"><div class="bar"><i id="progBar"></i></div>
              <div class="times"><span id="tEl">0:00</span><span id="tLeft">-0:00</span></div></div>
            <div class="ctrls">
              <button class="playbtn hidden" id="playBtn" aria-label="Play live stream"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
              <div class="vol hidden" id="volBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
                <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume"></div>
              <button class="reqbtn" id="openReq">Send a request</button>
            </div>
          </div>
        </div>
      </section>

      <form class="form hidden" id="reqForm" onsubmit="return false;" autocomplete="off">
        <h3>Send a request</h3>
        <div class="frow">
          <input id="rName" maxlength="40" placeholder="Name" required aria-label="Your name">
          <select id="rType" aria-label="Type"><option>Request</option><option>Shoutout</option><option>Traffic</option><option>Joke</option><option>Competition</option><option>Other</option></select>
        </div>
        <textarea id="rMsg" maxlength="300" placeholder="Your message" required aria-label="Your message"></textarea>
        <input class="hp" id="rWeb" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="btns"><button class="submit" id="rSend" type="submit">Submit</button><button class="cancel" type="button" id="rCancel">Cancel</button></div>
        <div class="msg" id="rMsgOut"></div>
      </form>
      <audio id="aud" preload="none"></audio>
    </div>

    <aside>
      <div class="card" id="airCard"><h2><span>On air</span></h2><div class="empty">Loading…</div></div>
      <div class="card"><h2><span>Recently played</span><span id="rpCount"></span></h2><div class="rp" id="recent"><div class="empty">Loading…</div></div></div>
    </aside>
  </div>
  <footer>KovsieX · University of the Free State student media</footer>
</div>

<script>
(function () {
"use strict";
var TZ = 'Africa/Johannesburg', MAX_RECENT = 5;
var CFG = window.KOVSIEX_CONFIG || {};
var API_URL = String(CFG.apiUrl || '').trim();
var MODE = API_URL.indexOf('https:') === 0 ? 'api' : (typeof google !== 'undefined' && google.script && google.script.run ? 'gas' : 'demo');
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).split('').map(function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c] || c; }).join(''); };
var ini = function (n) { return String(n || '?').split(' ').filter(Boolean).map(function (x) { return x[0]; }).slice(0, 2).join('').toUpperCase(); };
var offset = 0, np = null, recent = [], typesSet = false, pollTimer = null, endedAt = 0, showState = null;

function run(fn, arg) {
  var args = arg === undefined ? [] : [arg];
  if (MODE === 'demo') return Promise.resolve(DEMO[fn] ? DEMO[fn](arg) : null);
  if (MODE === 'gas') return new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args); });
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { return r.json(); }, function () { throw new Error('Could not reach KovsieX right now. Please try again.'); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong.'); return j.result; });
}
var now = function () { return Date.now() + offset; };
function mmss(ms) { ms = Math.max(0, ms); var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function dur(ms) { ms = Math.max(0, ms); var h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
function songEnd(s) { return s && s.duration ? s.startMs + s.duration * 1000 : 0; }

/* ── Live panel ── */
function paintLive(animate) {
  var box = $('liveTop');
  var apply = function () {
    var s = np;
    $('artBox').innerHTML = s && s.art ? '<img class="art" src="' + esc(s.art) + '" alt="">' : '<div class="art ph">♪</div>';
    $('liveBg').style.backgroundImage = s && s.art ? 'url("' + s.art + '")' : 'none';
    $('npTitle').textContent = s ? s.title : (showState && showState.onAir.length ? showState.onAir[0].show : 'KovsieX Radio');
    $('npArtist').textContent = s ? s.artist : (showState && showState.onAir.length ? 'with ' + showState.onAir[0].name : 'Live from the UFS campus');
    $('npLabel').textContent = s ? 'Now playing' : (showState && showState.onAir.length ? 'On air now' : 'KovsieX Radio');
    $('eq').classList.toggle('paused', !s);
    $('prog').classList.toggle('hidden', !(s && s.duration));
    document.title = s ? s.title + ' · ' + s.artist + ' | KovsieX Radio' : 'KovsieX Radio · Live';
    tick();
  };
  if (animate) { box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); setTimeout(apply, 260); }
  else apply();
}

/* ── Recently played: newest on top, 5 max, old ones slide out the bottom ── */
function trackEl(s) {
  var d = document.createElement('div'); d.className = 'track'; d.setAttribute('data-id', s.id);
  d.innerHTML = (s.art ? '<img src="' + esc(s.art) + '" alt="" loading="lazy">' : '<div class="ph">♪</div>') +
    '<div class="t"><b>' + esc(s.title) + '</b><span>' + esc(s.artist) + '</span></div><div class="tm">' + esc(s.at) + '</div>';
  return d;
}
function paintRecent(list) {
  var box = $('recent');
  list = list.slice(0, MAX_RECENT);
  var empty = box.querySelector('.empty'); if (empty && list.length) empty.remove();
  var want = list.map(function (s) { return s.id; });
  Array.prototype.slice.call(box.querySelectorAll('.track')).forEach(function (el) {
    if (want.indexOf(el.getAttribute('data-id')) < 0 && !el.classList.contains('leave')) {
      el.classList.add('leave'); setTimeout(function () { el.remove(); }, 550);
    }
  });
  var anchor = null;
  list.forEach(function (s, i) {
    var el = box.querySelector('.track[data-id="' + s.id + '"]:not(.leave)');
    if (!el) {
      el = trackEl(s); el.classList.add('enter');
      var live = Array.prototype.slice.call(box.querySelectorAll('.track:not(.leave)'));
      box.insertBefore(el, anchor ? anchor.nextSibling : live[0] || box.firstChild);
      (function (e, delay) { setTimeout(function () { e.classList.remove('enter'); }, 30 + delay); })(el, i * 90);
    } else if (s.art && !el.querySelector('img')) { el.querySelector('.ph').outerHTML = '<img src="' + esc(s.art) + '" alt="">'; }
    anchor = el;
  });
  if (!list.length && !box.querySelector('.track')) box.innerHTML = '<div class="empty">No songs logged yet.</div>';
  recent = list;
}

/* ── Apply a server update ── */
function applyNow(r) {
  if (!r) return;
  if (r.serverNow) offset = r.serverNow - Date.now();
  var changed = (np ? np.id : '') !== (r.np ? r.np.id : '');
  if (changed) {
    if (r.np) endedAt = 0;
    np = r.np; paintLive(true);
  } else if (np && r.np) {                       /* same song: artwork or length may have arrived */
    var artNew = !np.art && r.np.art; np = r.np; if (artNew) paintLive(false);
  }
  paintRecent(r.recent || []);
  schedule();
}
/* Song reached its end locally → move it to Recently played right away, then look for the next one quickly */
function finishLocally() {
  if (!np) return;
  var done = np; np = null; endedAt = now(); paintLive(true);
  paintRecent([done].concat(recent.filter(function (s) { return s.id !== done.id; })));
  schedule(400);
}

/* ── Checks every 2 seconds while the page is open, faster as a song ends, slow in a background tab ── */
function schedule(force) {
  clearTimeout(pollTimer);
  var t = now(), base = Number(CFG.pollMs) || 2000, delay = base;
  if (force !== undefined) delay = force;
  else if (np && np.duration && songEnd(np) - t < 8000) delay = Math.min(base, 1200);   /* song about to end */
  if (document.hidden) delay = 30000;                                                   /* tab in background */
  pollTimer = setTimeout(pollNow, delay);
}
var polling = false;
function pollNow() {
  if (polling) return; polling = true;
  run('publicNow').then(applyNow).catch(function () { schedule(8000); }).then(function () { polling = false; });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) pollNow(); });

/* ── Shows on air (changes rarely) ── */
function paintShows(st) {
  showState = st;
  if (!typesSet && st.types) { $('rType').innerHTML = st.types.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join(''); typesSet = true; }
  if (st.streamUrl) { if ($('aud').getAttribute('src') !== st.streamUrl) $('aud').setAttribute('src', st.streamUrl);
    $('playBtn').classList.remove('hidden'); $('volBox').classList.remove('hidden'); }
  var a = st.onAir[0], n = st.next, t = now();
  $('airPill').outerHTML = a ? '<span class="onair-pill" id="airPill"><i></i>ON AIR</span>' : '<span class="offair-pill" id="airPill">OFF AIR</span>';
  var pic = function (o) { return o.image ? '<img src="' + o.image + '" alt="">' : '<div class="ph">' + esc(ini(o.show)) + '</div>'; };
  var h = '<h2><span>' + (a ? 'On air now' : 'Up next') + '</span></h2>';
  if (a) h += '<div class="show">' + pic(a) + '<div><b>' + esc(a.show) + '</b><span>' + esc(a.name) + (a.with ? ' with ' + esc(a.with) : '') + '</span><span>' + a.start + ' – ' + a.end + '</span></div>' +
    '<div class="timer"><div data-since="' + a.startMs + '">' + dur(t - a.startMs) + '</div><small>live for</small></div></div>';
  else if (n) h += '<div class="show">' + pic(n) + '<div><b>' + esc(n.show) + '</b><span>' + esc(n.name) + (n.with ? ' with ' + esc(n.with) : '') + '</span><span>' + n.start + ' – ' + n.end + '</span></div>' +
    '<div class="timer"><div data-until="' + n.startMs + '">' + dur(n.startMs - t) + '</div><small>starts in</small></div></div>';
  else h += '<div class="empty">No shows scheduled yet — check back soon.</div>';
  $('airCard').innerHTML = h;
  if (!np) paintLive(false);
}
function pollShows() { run('publicGetState').then(function (st) { if (!st) return; paintShows(st); applyNow({ np: st.nowPlaying, recent: st.recent, serverNow: st.serverNow }); }).catch(function () {}); }

/* ── Every second ── */
function tick() {
  var t = now();
  $('clock').textContent = new Date(t).toLocaleTimeString('en-GB', { timeZone: TZ, hour12: false }) + ' SAST';
  if (np && np.duration) {
    var el = t - np.startMs, total = np.duration * 1000;
    $('progBar').style.width = Math.min(100, el / total * 100) + '%';
    $('tEl').textContent = mmss(Math.min(el, total)); $('tLeft').textContent = '-' + mmss(total - el);
    if (el > total + 1500) finishLocally();
  }
  document.querySelectorAll('[data-since]').forEach(function (e) { e.textContent = dur(t - Number(e.getAttribute('data-since'))); });
  document.querySelectorAll('[data-until]').forEach(function (e) { e.textContent = dur(Number(e.getAttribute('data-until')) - t); });
  document.querySelectorAll('[data-left]').forEach(function (e) { e.textContent = dur(Number(e.getAttribute('data-left')) - t) + ' left'; });
}

/* ── Request form ── */
$('openReq').onclick = function () { $('reqForm').classList.remove('hidden'); $('rName').focus(); $('reqForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
$('rCancel').onclick = function () { $('reqForm').classList.add('hidden'); $('rMsgOut').textContent = ''; };
$('reqForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var out = $('rMsgOut'), b = $('rSend'); out.className = 'msg'; out.textContent = ''; b.disabled = true;
  run('publicSendRequest', { name: $('rName').value, type: $('rType').value, message: $('rMsg').value, website: $('rWeb').value })
    .then(function () { out.className = 'msg ok'; out.textContent = 'Sent! The presenter will see it in the studio.'; $('rMsg').value = ''; })
    .catch(function (err) { out.className = 'msg bad'; out.textContent = String((err && err.message) || err).split('Error: ').join(''); })
    .then(function () { b.disabled = false; });
});

/* ── Player ── */
var aud = $('aud');
function setVol() { var v = Number($('vol').value); aud.volume = v / 100; $('vol').style.setProperty('--p', v + '%'); }
$('vol').oninput = setVol; setVol();
var PLAY = '<path d="M7 4v16l13-8z"/>', PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
$('playBtn').onclick = function () {
  if (aud.paused) { aud.play().then(function () { $('playIco').innerHTML = PAUSE; }).catch(function () { $('playIco').innerHTML = PLAY; }); }
  else { aud.pause(); $('playIco').innerHTML = PLAY; }
};

/* ── Demo mode (opened without a server): songs change every ~25 seconds ── */
var DEMO = (function () {
  var songs = [['Water','Tyla'],['Push It','Salt-N-Pepa'],['Mnike','Tyler ICU, Tumela_za'],['Tanzania','Uncle Waffles'],['Sponono','Kabza De Small'],['Khona','Mafikizolo'],['Ghanama','Makhadzi']];
  var t0 = Date.now() - 18000, LEN = 25;
  function at(ms) { return new Date(ms).toLocaleTimeString('en-GB', { timeZone: TZ, hour12: false }).slice(0, 5); }
  function state() {
    var t = Date.now(), k = Math.floor((t - t0) / (LEN * 1000)), list = [];
    for (var i = k; i >= Math.max(0, k - MAX_RECENT); i--) {
      var s = songs[(i + songs.length * 10) % songs.length], st = t0 + i * LEN * 1000;
      list.push({ id: 'd' + i, title: s[0], artist: s[1], art: '', duration: LEN, startMs: st, at: at(st) });
    }
    return { np: list[0], recent: list.slice(1, MAX_RECENT + 1), serverNow: t };
  }
  return {
    publicNow: state,
    publicGetState: function () { var s = state(), t = Date.now();
      return { serverNow: t, streamUrl: '', types: ['Request','Shoutout','Traffic','Joke','Competition','Other'], nowPlaying: s.np, recent: s.recent,
        onAir: [{ show: 'Drive Time', name: 'Ayanda Dlamini', with: 'Lerato Nkosi', start: '16:00', end: '18:00', image: '', startMs: t - 47 * 6e4, endMs: t + 73 * 6e4 }], next: null }; },
    publicSendRequest: function () { return { ok: true }; }
  };
})();

tick(); setInterval(tick, 1000);
pollShows(); setInterval(pollShows, 60000);
})();
</script>
</body>
